project:
  name: Break-RAG
  environment: development
  random_seed: 42
  log_level: INFO

adapter:
  type: mock
  mock_profile: healthy
  timeout: 30

evaluation:
  enabled: true
  dataset_path: datasets/evaluation/sample_questions.json
  top_k: 5
  metrics:
    - precision_at_k
    - recall_at_k
    - hit_rate_at_k
    - mrr
    - ndcg_at_k
    - answer_correctness
    - answer_relevance
    - faithfulness
    - context_relevance
    - hallucination_rate
    - citation_precision
    - citation_recall
    - citation_coverage
    - unsupported_claim_rate
  llm_judge:
    enabled: false

adversarial:
  enabled: true
  generation_mode: rule_based
  save_generated_path: results/generated_attacks
  attacks:
    prompt_injection:
      enabled: true
      count: 5
      difficulty: medium
    context_poisoning:
      enabled: true
      count: 5
      difficulty: medium
    ambiguous_queries:
      enabled: true
      count: 5
      difficulty: medium
    unanswerable:
      enabled: true
      count: 5
      difficulty: medium
    conflicting_documents:
      enabled: true
      count: 5
      difficulty: medium
    retrieval_manipulation:
      enabled: true
      count: 5
      difficulty: medium
    multi_hop:
      enabled: true
      count: 5
      difficulty: medium
    information_leakage:
      enabled: true
      count: 5
      difficulty: medium
    context_overload:
      enabled: true
      count: 5
      difficulty: medium
    citation_manipulation:
      enabled: true
      count: 5
      difficulty: medium

execution:
  concurrency: 4
  compute_robustness_score: true
  evaluation_weight: 0.4
  adversarial_weight: 0.6

reporting:
  output_dir: results/reports
  formats:
    - html
    - json
    - csv

storage:
  type: sqlite
  database_path: results/breakrag.db

